<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DELC Dinner Seating</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://delcdata.github.io/DELCAppsHub/shared-auth.js?v=3"></script>
<style>
:root{
  --navy:#1B3254; --navy2:#26446f; --gold:#C8973A; --gold2:#e9d3a6;
  --bg:#F4F1EA; --card:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e2dccf;
  --ok:#2E8B57; --warn:#E0A526; --bad:#C0392B; --soft:#faf8f3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* header */
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo{background:var(--gold);color:var(--navy);border-radius:6px;padding:2px 7px;font-weight:800;font-size:14px}
.evname{font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.spacer{flex:1}
.conn{font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#999;display:inline-block}
.dot.live{background:#4ade80}.dot.poll,.dot.connecting{background:#facc15}.dot.bad{background:#f87171}.dot.local{background:#93c5fd}
.top select,.top .tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.top select option{color:#000}
.tabs{display:flex;gap:4px;padding:8px 12px 0;background:var(--navy);overflow-x:auto;position:sticky;top:0}
.tab{background:transparent;border:0;color:#c9d3e3;padding:9px 14px;border-radius:10px 10px 0 0;font-weight:600;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--navy)}
.demo-banner{background:#dbeafe;color:#1e3a8a;text-align:center;font-size:13px;padding:5px}

/* generic */
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--navy)}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.warn{background:var(--warn);color:#1d1d1d;border-color:var(--warn)}
.btn.bad{background:#fff;color:var(--bad);border-color:#efc2bd}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);font-size:15px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:#eef1f6;color:var(--navy);white-space:nowrap}
.chip.gf{background:#fbefd9;color:#8a5a00}
.chip.kid{background:#e7f5ec;color:#1d6b40}
.chip.to{background:#efe7fb;color:#5b2d9c}
.chip.state-open{background:#eef1f6}.chip.state-seated,.chip.state-full{background:#dcebff;color:#174a8b}
.chip.state-bussing{background:#fdecc0;color:#7a5200}.chip.state-held{background:#fff3d6;color:#7a5200}.chip.state-blocked{background:#e5e5e5;color:#555}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;border:1px solid rgba(0,0,0,.15)}

/* login / events */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:380px}
.login h1{margin:8px 0 2px;color:var(--navy);font-size:24px}
.stack{display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.link{background:none;border:0;color:var(--navy2);text-decoration:underline;padding:0;font-size:13px}
.events{max-width:760px;margin:24px auto;padding:0 16px}
.evcard{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:10px;cursor:pointer}
.evcard:hover{border-color:var(--navy)}
.evcard h3{margin:0 0 3px;color:var(--navy);font-size:17px}

/* host floor */
.host{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;padding:14px;align-items:start}
.floorcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;min-width:96px}
.stat b{font-size:20px;color:var(--navy);line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.floorbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;position:relative}
svg.floor{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;touch-action:manipulation}
svg.floor.mode-layout{touch-action:none}
svg.floor .tbl,svg.floor .fix{cursor:pointer}
svg.floor.mode-layout .tbl,svg.floor.mode-layout .fix{cursor:grab}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:2px 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.seatbar{background:var(--navy);color:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px rgba(27,50,84,.25)}
.seatbar .btn{border-color:transparent}
.seatbar .warnline{color:#ffd88a;font-size:13px}
.board{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 130px);position:sticky;top:110px;min-height:420px}
.board-top{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.board-top .inp{flex:1}
.btabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.btab{border:0;background:transparent;padding:6px 8px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.btab.on{background:var(--navy);color:#fff}
.btab .n{opacity:.75;font-weight:500;margin-left:3px}
.plist{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard{border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;background:#fff}
.pcard.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pno{background:var(--navy);color:#fff;border-radius:9px;min-width:40px;text-align:center;padding:6px 4px;font-weight:800;font-size:15px;align-self:start;cursor:pointer}
.pcard.to .pno{background:#5b2d9c}
.pname{font-weight:700;cursor:pointer}
.pname .more{font-weight:500;color:var(--muted);font-size:13px}
.pmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}
.pact{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pact .when{font-size:12px;color:var(--muted);margin-right:auto}
.roomtabs{display:flex;gap:6px;flex-wrap:wrap}
.roomtab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--navy);font-size:14px}
.roomtab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.roomtab .n{font-weight:500;opacity:.75;font-size:12px;margin-left:4px}
.why{grid-column:1/-1;font-size:12.5px;font-weight:700;color:#8a5a00;background:#fbefd9;border-radius:7px;padding:3px 8px}
.chip.over{background:#fde2df;color:#a3281c}
.stat.alert{border-color:#efb3ab;background:#fff5f4}.stat.alert b{color:var(--bad)}
.mres{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.mres button{text-align:left}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}

/* pages */
.page{padding:14px;max-width:1300px;margin:0 auto}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px}
.side h3,.card h3{margin:0 0 8px;color:var(--navy);font-size:16px}
.secrow{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.secrow.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.colors{display:flex;gap:5px;flex-wrap:wrap}
.colors button{width:24px;height:24px;border-radius:6px;border:2px solid transparent}
.colors button.on{border-color:var(--ink)}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.palette .btn{text-align:left}
table.pt{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
table.pt th{position:sticky;top:0;background:#f1ede4;text-align:left;font-size:12px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);z-index:1}
table.pt td{border-bottom:1px solid #eee8dc;padding:5px 6px;vertical-align:middle}
table.pt input.inp{padding:5px 7px;font-size:14px;width:100%}
table.pt input.num{width:56px}
table.pt input.pn{width:62px;font-weight:700}
table.pt tr.done td{opacity:.55}
.tablewrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:12px}
textarea.paste{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.preview{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px}
.preview ul{margin:6px 0 0 18px;padding:0}

/* server / takeout */
.srv{max-width:760px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.tcard{border:1px solid var(--line);border-left:8px solid #999;border-radius:12px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:8px}
.tcard h4{margin:0;font-size:18px;color:var(--navy);display:flex;align-items:center;gap:8px}
.tcard .btn{padding:10px 14px}
.bigbtns{display:flex;gap:8px;flex-wrap:wrap}
.torow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.torow .pno{min-width:48px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media(min-width:700px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:18px}}
.modal h2{margin:0;color:var(--navy);font-size:20px}
.mhead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;margin-bottom:12px}
.x{border:0;background:#f1f1f1;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
.mlist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.mitem{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tickets{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tickets label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #f0ece3;font-size:14px}
.sectitle{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}

#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:auto}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

@media(max-width:1000px){
  .host,.split{grid-template-columns:1fr}
  .board{position:static;max-height:none}
  .plist{max-height:none}
}
@media(max-width:600px){
  .evname{max-width:60vw}
  .grid2{grid-template-columns:1fr}
  .stat{min-width:0;flex:1 1 30%}
  .top{padding:8px 12px}
}
@media print{
  .top,.tabs,.board,.stats,.seatbar,.legend,.demo-banner{display:none!important}
  .host{display:block;padding:0}
  .floorbox{border:0}
}
</style>

<script>
/* ============================================================
   DELC Dinner Seating — single-file app
   Data: Supabase project DELCFBPortal, tables seat_events,
   seat_sections, seat_tables, seat_parties (realtime enabled).
   ============================================================ */
const CONFIG = {
  url: 'https://ksdxhqyusaylfpyeecbv.supabase.co',
  key: 'sb_publishable_2LJBKHTG1fXcMzWWHf1Mrg_EsrC4_JC',
  password: 'Delc.1200!',   // fallback only if the hub login service can't be reached
  appKey: 'delcdining',     // key in hub_apps / hub_users.allowed_apps
  hubUrl: 'https://delcdata.github.io/DELCAppsHub/'
};
const TBL = {events:'seat_events', sections:'seat_sections', tables:'seat_tables', parties:'seat_parties'};
const KIND_OF = {seat_events:'events', seat_sections:'sections', seat_tables:'tables', seat_parties:'parties'};
const SEC_COLORS = ['#2F80ED','#27AE60','#9B51E0','#EB5757','#F2994A','#00A3A3','#C2185B','#6D4C41'];
const W = 1000, H = 830;

const DEFAULT_FIXTURES = [
  {id:'f1',kind:'pill',x:50,y:16,w:124,h:22,text:'Exit to Sanctuary',color:'#8FB996'},
  {id:'f2',kind:'pill',x:214,y:16,w:124,h:22,text:'Hospitality Closet',color:'#B7BCE3'},
  {id:'f3',kind:'stage',x:348,y:44,w:326,h:8,text:'Stage'},
  {id:'f4',kind:'pill',x:830,y:16,w:124,h:22,text:'Stage Entrance',color:'#B7BCE3'},
  {id:'f5',kind:'pill',x:922,y:112,w:66,h:40,text:'Emerg. Exit',color:'#F08080'},
  {id:'f6',kind:'box',x:190,y:735,w:130,h:52,text:'Dessert'},
  {id:'f7',kind:'box',x:585,y:735,w:140,h:52,text:'Beverage'},
  {id:'f8',kind:'pill',x:430,y:798,w:160,h:22,text:'Main Entrance',color:'#8FB996'},
  {id:'f9',kind:'pill',x:752,y:798,w:100,h:22,text:'Kitchen',color:'#B7BCE3'},
  {id:'f10',kind:'box',x:866,y:742,w:118,h:46,text:'Take-out Pickup'}
];
const DEFAULT_TABLES = [
  ['1',127,150,-10],['2',138,321,-10],['3',150,475,-10],['A',166,640,-12],
  ['4',377,130,0],['7',596,130,0],['5',388,300,90],['6',399,520,90],['8',590,300,90],['9',590,520,90],
  ['10',826,150,10],['11',816,315,10],['12',816,470,10],['B',822,640,18]
];

/* ---------------- state ---------------- */
const S = {
  user: null, userName: '', backend: 'remote', conn: 'connecting', saveErr: false,
  events: [], ev: null, sections: [], tables: [], parties: [],
  role: 'host', view: 'floor', btab: 'waiting', q: '',
  sel: {partyId:null, tableIds:[], moving:false, tableId:null, fixtureId:null, paint:null},
  modal: null, undo: [], serverSection: null, room: null, mergeQ: '', importText: '', importPreview: null,
  partySel: new Set(), _tx: null, drag: null, pendingBg: false
};

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const int = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : Math.max(0, n); };
const lsGet = (k, d=null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const mins = iso => iso ? Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000)) : 0;
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
const fmtDate = d => { if(!d) return ''; const [y,m,dd] = d.split('-').map(Number); return new Date(y, m-1, dd).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'}); };
function toast(msg, kind='') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  const box = $('#toast'); box.appendChild(el); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => el.remove(), kind === 'bad' ? 5000 : 2600);
}

/* ---------------- backends ---------------- */
const Local = {
  key: 'seatapp_demo_db',
  db() { return lsGet(this.key) || {events:[], sections:[], tables:[], parties:[]}; },
  save(d) { lsSet(this.key, d); },
  async listEvents() { return this.db().events.slice().sort((a,b) => (b.event_date||'').localeCompare(a.event_date||'')); },
  async loadEvent(id) { const d = this.db(); const f = r => r.event_id === id; return {sections:d.sections.filter(f), tables:d.tables.filter(f), parties:d.parties.filter(f)}; },
  async upsert(kind, rows) { const d = this.db(); rows.forEach(r => { const a = d[kind]; const i = a.findIndex(x => x.id === r.id); if (i >= 0) a[i] = r; else a.push(r); }); this.save(d); },
  async remove(kind, ids) {
    const d = this.db();
    if (kind === 'events') ['sections','tables','parties'].forEach(k => d[k] = d[k].filter(r => !ids.includes(r.event_id)));
    d[kind] = d[kind].filter(r => !ids.includes(r.id)); this.save(d);
  },
  subscribe(eventId, cb) {
    this.unsubscribe();
    this._h = e => { if (e.key === this.key) cb({reload:true}); };
    window.addEventListener('storage', this._h); setConn('local');
  },
  unsubscribe() { if (this._h) window.removeEventListener('storage', this._h); this._h = null; }
};
const Remote = {
  sb: null, ch: null,
  init() { this.sb = window.supabase.createClient(CONFIG.url, CONFIG.key); },
  async q(p) { const {data, error} = await p; if (error) throw error; return data; },
  listEvents() { return this.q(this.sb.from('seat_events').select('*').order('event_date', {ascending:false})); },
  async loadEvent(id) {
    const [sections, tables, parties] = await Promise.all(['seat_sections','seat_tables','seat_parties']
      .map(n => this.q(this.sb.from(n).select('*').eq('event_id', id))));
    return {sections, tables, parties};
  },
  upsert(kind, rows) { return this.q(this.sb.from(TBL[kind]).upsert(rows)); },
  remove(kind, ids) { return this.q(this.sb.from(TBL[kind]).delete().in('id', ids)); },
  subscribe(eventId, cb) {
    this.unsubscribe(); setConn('connecting');
    const ch = this.sb.channel('seat-' + eventId + '-' + Math.random().toString(36).slice(2,7));
    ['seat_sections','seat_tables','seat_parties'].forEach(t =>
      ch.on('postgres_changes', {event:'*', schema:'public', table:t, filter:'event_id=eq.' + eventId}, pl => cb({kind:KIND_OF[t], pl})));
    ch.on('postgres_changes', {event:'*', schema:'public', table:'seat_events', filter:'id=eq.' + eventId}, pl => cb({kind:'events', pl}));
    ch.subscribe(st => {
      if (st === 'SUBSCRIBED') { setConn('live'); reloadEvent(); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') setConn('poll');
    });
    this.ch = ch;
  },
  unsubscribe() { if (this.ch) { this.sb.removeChannel(this.ch); this.ch = null; } }
};
let B = Remote;

/* write queue: survives flaky wifi, retries until saved */
const Q = {pend: new Map(), busy: false};
function queueUpsert(kind, row) { Q.pend.set(kind + ':' + row.id, {op:'up', kind, row}); flush(); }
function queueDelete(kind, id) { Q.pend.set(kind + ':' + id, {op:'del', kind, id}); flush(); }
async function flush() {
  if (Q.busy) return; Q.busy = true;
  while (Q.pend.size) {
    const [k, job] = Q.pend.entries().next().value;
    try {

/* ---------------- data loading / sync ---------------- */
async function loadEvents() { try { S.events = await B.listEvents(); } catch (e) { console.error(e); toast('Could not load events: ' + (e.message || e), 'bad'); } }
function overlayPending(kind, rows) {
  const map = new Map(rows.map(r => [r.id, r]));
  for (const job of Q.pend.values()) if (job.kind === kind) { if (job.op === 'up') map.set(job.row.id, job.row); else map.delete(job.id); }
  return [...map.values()];
}
async function reloadEvent() {
  if (!S.ev) return;
  try {
    const [d, evs] = await Promise.all([B.loadEvent(S.ev.id), B.listEvents()]);
    S.events = overlayPending('events', evs);
    const ev = S.events.find(e => e.id === S.ev.id); if (!ev) { toast('This event was deleted', 'bad'); S.ev = null; render(); return; }
    S.ev = ev;
    S.sections = overlayPending('sections', d.sections); S.tables = overlayPending('tables', d.tables); S.parties = overlayPending('parties', d.parties);
    scheduleBg();
  } catch (e) { console.warn('reload failed', e); }
}
function onRemote(msg) {
  if (msg.reload) { reloadEvent(); return; }
  const {kind, pl} = msg;
  if (pl.eventType === 'DELETE') {
    const id = pl.old && pl.old.id; if (!id || Q.pend.has(kind + ':' + id)) return;
    if (kind === 'events') { toast('This event was deleted', 'bad'); S.ev = null; loadEvents().then(render); return; }
    const a = arr(kind); const i = a.findIndex(r => r.id === id); if (i >= 0) a.splice(i, 1);
  } else {
    const row = pl.new; if (!row || Q.pend.has(kind + ':' + row.id)) return;
    if (kind === 'events') { if ((row.updated_at||'') >= (S.ev.updated_at||'')) { S.ev = row; const i = S.events.findIndex(e => e.id === row.id); if (i >= 0) S.events[i] = row; } }
    else { const a = arr(kind); const i = a.findIndex(r => r.id === row.id); if (i < 0) a.push(row); else if ((row.updated_at||'') >= (a[i].updated_at||'')) a[i] = row; }
  }
  scheduleBg();
}
setInterval(() => { if (S.ev && S.backend === 'remote' && S.conn !== 'live') reloadEvent(); }, 10000);

async function openEvent(id) {
  const ev = S.events.find(e => e.id === id); if (!ev) return;
  try {
    const d = await B.loadEvent(id);
    S.ev = ev; S.sections = d.sections; S.tables = d.tables; S.parties = d.parties;
    S.undo = []; S.room = null; S.q = ''; S.sel = {partyId:null, tableIds:[], moving:false, tableId:null, fixtureId:null, paint:null}; S.partySel = new Set();
    S.serverSection = lsGet('seat_srv_' + id); lsSet('seat_last_event', id);
    S.view = S.role === 'host' ? (S.tables.length && !S.parties.length ? 'setup' : 'floor') : S.role === 'server' ? 'server' : 'takeout';
    B.subscribe(id, onRemote); S.modal = null; render();
  } catch (e) { console.error(e); toast('Could not open event: ' + (e.message || e), 'bad'); }
}
async function createEvent() {

  const id = uid(); const t0 = nowIso();

  const ev = {id, name, event_date: $('#ne_date').value || null, start_time: $('#ne_s').value.trim(), end_time: $('#ne_e').value.trim(), notes: '',
    fixtures: srcEv ? clone(srcEv.fixtures || []) : clone(DEFAULT_FIXTURES), settings: srcEv ? clone(srcEv.settings || {bus:true}) : {bus:true}, archived: false, created_at: t0, updated_at: t0};
  let sections = [], tables = [];
  try {

      const d = await B.loadEvent(src); const map = {};
      sections = d.sections.map(s => { const n = {...s, id: uid(), event_id: id, updated_at: t0}; map[s.id] = n.id; return n; });

  },
  noshow(d) { const p = prt(d.pid); tx('No-show #' + p.party_no, () => upd('parties', d.pid, {status:'noshow', table_ids:[]})); S.modal = null; render(); },
  clearTable(d) { clearTable(d.tid); },
  block(d) { setBlocked(d.tid, true); },
  unblock(d) { setBlocked(d.tid, false); },
  toReady(d) { const p = prt(d.pid); tx('Take-out ready #' + p.party_no, () => upd('parties', d.pid, {status:'ready', arrived_at: nowIso()})); render(); },
  toPicked(d) { const p = prt(d.pid); tx('Picked up #' + p.party_no, () => upd('parties', d.pid, {status:'picked', done_at: nowIso()})); toast(`#${p.party_no} picked up`, 'ok'); render(); },
  toReset(d) { const p = prt(d.pid); tx('Reopen take-out #' + p.party_no, () => upd('parties', d.pid, {status:'ready', done_at: null})); render(); },
  openParty(d) { S.mergeQ = ''; S.modal = {type:'party', id: d.pid}; render(); },
  saveParty(d) {
    const p = prt(d.pid); const no = $('#mp_no').value === '' ? null : int($('#mp_no').value);
    const patch = {party_no: no, name: $('#mp_name').value.trim(), adults: int($('#mp_a').value), kids: int($('#mp_k').value), takeout: int($('#mp_to').value), gf: int($('#mp_gf').value),
      phone: $('#mp_ph').value.trim(), notes: $('#mp_notes').value.trim(), status: $('#mp_st').value};

  },
  deleteParty(d) { const p = prt(d.pid); if (!confirm(`Delete party #${p.party_no} ${p.name}?`)) return; tx('Delete #' + p.party_no, () => drop('parties', d.pid)); S.modal = null; S.partySel.delete(d.pid); render(); },
  mergeInto(d) {
    const p = prt(d.pid), target = prt(d.into); if (!p || !target) return;
    if (!confirm(`Merge #${p.party_no} ${p.name} into #${target.party_no} ${target.name}?`)) return;
    mergeParties(p.id, target.id); S.mergeQ = ''; S.modal = {type:'party', id: target.id}; render();
  },
  splitSel(d) { const idx = [...document.querySelectorAll('.tkchk:checked')].map(c => int(c.value)); if (!idx.length) { toast('Check the tickets to move first'); return; } splitParty(d.pid, idx); },
  mergeSel() {
    const ps = [...S.partySel].map(prt).filter(Boolean).sort((a,b) => (a.party_no|0) - (b.party_no|0)); if (ps.length < 2) return;
    const dst = ps[0]; if (!confirm(`Merge ${ps.length} parties into #${dst.party_no} ${dst.name}?`)) return;
    ps.slice(1).forEach(p => mergeParties(p.id, dst.id)); S.partySel = new Set(); render();
  },
  renumberAll() {
    if (!confirm('Renumber every party 1, 2, 3… in the current order? Take-out orders keep the number of the party they came with only if you merge them — otherwise they get their own number.')) return;
    const rows = S.parties.slice().sort((a,b) => (a.party_no|0) - (b.party_no|0) || isTO(a) - isTO(b) || (a.name||'').localeCompare(b.name||''));
    tx('Renumber all', () => rows.forEach((p, i) => { if (p.party_no !== i + 1) upd('parties', p.id, {party_no: i + 1}); }));
    toast('Parties renumbered 1–' + rows.length, 'ok'); render();
  },
  paint(d) { S.sel.paint = S.sel.paint === d.sid ? null : d.sid; render(); },
  addSection() {
    const used = S.sections.map(s => s.color); const color = SEC_COLORS.find(c => !used.includes(c)) || SEC_COLORS[S.sections.length % SEC_COLORS.length];
    const s = {id: uid(), event_id: S.ev.id, name: 'Section ' + (S.sections.length + 1), color, server: '', sort: S.sections.length};
    tx('Add section', () => put('sections', s)); S.sel.paint = s.id; render();
  },
  delSection(d) {
    const s = sec(d.sid); if (!confirm(`Delete ${s.name}? Its tables become unassigned.`)) return;
    tx('Delete section', () => { S.tables.filter(t => t.section_id === d.sid).forEach(t => upd('tables', t.id, {section_id: null})); drop('sections', d.sid); });
    if (S.sel.paint === d.sid) S.sel.paint = null; render();
  },
  secColor(d) { tx('Section color', () => upd('sections', d.sid, {color: d.c})); render(); },
  autoSplit() {
    const n = Math.min(8, Math.max(1, int($('#nsplit').value) || 3));
    if (S.sections.length && !confirm(`Reassign every table into ${n} sections? Server names on existing sections are kept.`)) return;
    tx('Split into sections', () => {
      const secs = S.sections.slice().sort((a,b) => a.sort - b.sort);
      for (let i = secs.length; i < n; i++) { const s = {id: uid(), event_id: S.ev.id, name: 'Section ' + (i + 1), color: SEC_COLORS[i % SEC_COLORS.length], server: '', sort: i}; put('sections', s); secs.push(s); }
      const ri = t => rooms().findIndex(r => r.id === roomOf(t)); const ts = LT().sort((a,b) => ri(a) - ri(b) || a.x - b.x || a.y - b.y); const total = ts.reduce((s,t) => s + t.seats, 0);
      let acc = 0; ts.forEach(t => { const idx = Math.min(n - 1, Math.floor((acc + t.seats / 2) / (total / n))); acc += t.seats; upd('tables', t.id, {section_id: secs[idx].id}); });
    });
    toast(`Tables split into ${n} sections`, 'ok'); render();
  },
  room(d) { S.room = d.rid; S.sel.tableId = S.sel.fixtureId = null; render(); },
  addRoom() {
    const rs = rooms(); const name = rs.some(r => /family life/i.test(r.name)) ? 'Room ' + (rs.length + 1) : 'Family Life Center';
    const id = 'r' + uid().slice(0, 8);
    tx('Add room', () => upd('events', S.ev.id, {settings: {...(S.ev.settings || {}), rooms: [...rs, {id, name}]}}));
    S.room = id; toast(`Added ${name} — add tables with the buttons on the right`, 'ok'); render();
  },
  delRoom(d) {
    const rs = rooms(); if (rs.length < 2) return;
    if (S.tables.some(t => t.status !== 'split' && roomOf(t) === d.rid)) { toast('Move or delete the tables in this room first', 'bad'); return; }
    if (!confirm(`Remove ${roomName(d.rid)}?`)) return;
    const keep = rs.filter(r => r.id !== d.rid);
    tx('Remove room', () => upd('events', S.ev.id, {settings: {...(S.ev.settings || {}), rooms: keep}, fixtures: (S.ev.fixtures || []).filter(f => roomOf(f) !== d.rid)}));
    S.room = keep[0].id; render();
  },
  splitT(d) {
    const t = tbl(d.tid); const a = Math.floor(t.seats / 2), b = t.seats - a;
    const w = rectDims({seats: b, ends: 0}).w; const off = w / 2 + 3; const rad = (t.rot || 0) * Math.PI / 180;
    const dx = Math.cos(rad) * off, dy = Math.sin(rad) * off;
    const base = {event_id: t.event_id, shape: 'rect', ends: 0, rot: t.rot || 0, section_id: t.section_id, room: t.room || null, status: 'open', status_at: null, split_of: t.id};
    tx('Split table ' + t.label, () => {
      put('tables', {...base, id: uid(), label: t.label + 'a', seats: a, x: Math.round(t.x - dx), y: Math.round(t.y - dy)});
      put('tables', {...base, id: uid(), label: t.label + 'b', seats: b, x: Math.round(t.x + dx), y: Math.round(t.y + dy)});
      upd('tables', t.id, {status: 'split'});
    });
    toast(`Table ${t.label} split into ${t.label}a and ${t.label}b`, 'ok'); S.modal = null; S.sel.tableId = null; render();
  },
  rejoin(d) {
    const c = tbl(d.tid); const parent = tbl(c.split_of); const kids = S.tables.filter(x => x.split_of === c.split_of);
    if (!parent) { toast('Could not find the original table', 'bad'); return; }
    tx('Rejoin ' + parent.label, () => { kids.forEach(k => drop('tables', k.id)); upd('tables', parent.id, {status: 'open', status_at: nowIso()}); });
    toast(`Table ${parent.label} rejoined`, 'ok'); S.modal = null; S.sel.tableId = null; render();
  },
  addTable(d) {
    const seats = int(d.seats), shape = d.shape; const room = curRoom(); const first = room === rooms()[0].id;
    const pre = first ? (shape === 'round' ? 'R' : 'T') : (roomName(room).split(/\s+/).map(w => w[0]).join('').toUpperCase() || 'X') + '-';
    let k = 1; while (S.tables.some(t => t.label === pre + k)) k++;
    const t = {id: uid(), event_id: S.ev.id, label: pre + k, shape, seats, ends: d.ends != null ? int(d.ends) : null, room: first ? null : room, split_of: null,
      x: 0, y: 0, rot: 0, section_id: null, status: 'open', status_at: null};
    Object.assign(t, findSpot(t, room));
    tx('Add table', () => put('tables', t)); S.sel.tableId = t.id; S.sel.fixtureId = null; render();
    toast(`Added ${t.label} — drag it into place`);
  },
  rotT(d) { const t = tbl(S.sel.tableId); const r = +d.d === 0 ? 0 : ((t.rot || 0) + (+d.d) + 360) % 360; tx('Rotate', () => upd('tables', t.id, {rot: r > 180 ? r - 360 : r})); render(); },
  dupT() { const t = tbl(S.sel.tableId); const pre = t.shape === 'round' ? 'R' : 'T'; let k = 1; while (S.tables.some(x => x.label === pre + k)) k++;
    const n = {...clone(t), id: uid(), label: pre + k, split_of: null, x: Math.min(W - 60, t.x + 40), y: Math.min(H - 60, t.y + 40), status: 'open'}; tx('Duplicate table', () => put('tables', n)); S.sel.tableId = n.id; render(); },
  delT() {
    const t = tbl(S.sel.tableId); if (t.split_of) { toast('This is half of a split table — use “Rejoin halves” instead', 'bad'); return; }
    if (S.parties.some(p => (p.table_ids||[]).includes(t.id) && ['seated','expected','arrived'].includes(p.status))) { toast('Someone is seated at or holding this table', 'bad'); return; }
    if (!confirm(`Delete table ${t.label}?`)) return; tx('Delete table', () => drop('tables', t.id)); S.sel.tableId = null; render();
  },
  addFix() { const f = {id: 'f' + uid().slice(0, 8), kind: 'box', x: 440, y: 400, w: 120, h: 44, text: 'Station', room: curRoom() === rooms()[0].id ? undefined : curRoom()}; tx('Add label', () => upd('events', S.ev.id, {fixtures: [...(S.ev.fixtures||[]), f]})); S.sel.fixtureId = f.id; S.sel.tableId = null; render(); },
  delFix() { tx('Delete label', () => upd('events', S.ev.id, {fixtures: S.ev.fixtures.filter(f => f.id !== S.sel.fixtureId)})); S.sel.fixtureId = null; render(); },
  previewImport() { S.importText = $('#paste').value; previewImport(); },
  doImport(d) { doImport(d.mode); },
  saveEvent() {
    tx('Edit event', () => upd('events', S.ev.id, {name: $('#en').value.trim() || S.ev.name, event_date: $('#ed').value || null, start_time: $('#es').value.trim(), end_time: $('#ee').value.trim(), settings: {...(S.ev.settings||{}), bus: $('#ebus').checked, longMins: int($('#elong').value)}}));
    toast('Saved', 'ok'); render();
  },
  practiceReset() {
    if (!confirm('Reset the night? Every party goes back to expected, holds are released, and every table becomes open.')) return;
    tx('Reset night', () => {
      S.parties.forEach(p => { if (p.status !== 'expected' || (p.table_ids||[]).length || p.arrived_at) upd('parties', p.id, {status: 'expected', table_ids: [], arrived_at: null, seated_at: null, done_at: null}); });
      S.tables.forEach(t => { if (t.status !== 'open' && t.status !== 'split') upd('tables', t.id, {status: 'open', status_at: null}); });
    });
    toast('Night reset', 'ok'); render();
  },
  exportJson() {
    const data = {app: 'delc-seating', version: 1, exported_at: nowIso(), event: S.ev, sections: S.sections, tables: S.tables, parties: S.parties};
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'}));
    a.download = `seating-${(S.ev.name || 'event').replace(/\W+/g, '-')}-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  importJson() { const f = $('#jsonFile'); f.value = ''; f.onchange = () => f.files[0] && restoreBackup(f.files[0]); f.click(); },
  printMap() { S.view = 'floor'; S.sel.partyId = null; render(); setTimeout(() => window.print(), 100); },
  async deleteEvent() {
    if (prompt(`Type DELETE to permanently delete “${S.ev.name}” and all its parties.`) !== 'DELETE') return;
    try { await B.remove('events', [S.ev.id]); B.unsubscribe(); S.events = S.events.filter(e => e.id !== S.ev.id); S.ev = null; lsSet('seat_last_event', null); toast('Event deleted'); render(); }
    catch (e) { toast('Could not delete: ' + (e.message || e), 'bad'); }
  }
};
function statusPatch(p, st) {
  const t = nowIso();
  if (st === 'arrived') return {arrived_at: p.arrived_at || t};
  if (st === 'seated') return {seated_at: p.seated_at || t, arrived_at: p.arrived_at || t};
  if (st === 'done' || st === 'picked') return {done_at: t};
  if (st === 'expected') return {arrived_at: null, seated_at: null, done_at: null, table_ids: []};
  if (st === 'noshow' || st === 'cancelled') return {table_ids: []};
  if (st === 'ready') return {arrived_at: t};
  return {};
}
function renumberConflict(p, no) {
  if (no == null) return false;
  const other = S.parties.find(q => q.id !== p.id && q.party_no === no && active(q) && isTO(q) === isTO(p));
  if (!other) return false;
  if (confirm(`Party #${no} already exists (${other.name}, ${isTO(other) ? other.takeout + ' take-out' : size(other) + ' guests'}).\n\nOK = merge #${p.party_no} into #${no}\nCancel = keep both with the same number`)) {
    mergeParties(p.id, other.id); S.modal = null; render(); return true;
  }
  return false;
}
async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text()); if (!data.event || !Array.isArray(data.tables)) throw new Error('Not a seating backup file');
    const id = uid(); const t0 = nowIso(); const sm = {}, tm = {};
    const ev = {...data.event, id, name: data.event.name + ' (restored)', created_at: t0, updated_at: t0};
    const sections = (data.sections || []).map(s => { const n = {...s, id: uid(), event_id: id, updated_at: t0}; sm[s.id] = n.id; return n; });
    data.tables.forEach(t => tm[t.id] = uid());
    const tables = data.tables.map(t => ({...t, id: tm[t.id], event_id: id, section_id: t.section_id ? sm[t.section_id] || null : null, split_of: t.split_of ? tm[t.split_of] || null : null, updated_at: t0}));
    const parties = (data.parties || []).map(p => ({...p, id: uid(), event_id: id, table_ids: (p.table_ids || []).map(x => tm[x]).filter(Boolean), updated_at: t0}));
    await B.upsert('events', [ev]); if (sections.length) await B.upsert('sections', sections); if (tables.length) await B.upsert('tables', tables); if (parties.length) await B.upsert('parties', parties);
    S.events.unshift(ev); await openEvent(id); toast('Backup restored as a new event', 'ok');
  } catch (e) { toast('Restore failed: ' + (e.message || e), 'bad'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.dataset.act === 'bgClose' && b !== e.target) return;
  fn(b.dataset, e, b);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'lp' || e.target.id === 'lu')) ACT.login();
  if (e.key === 'Escape') { if (S.modal) { S.modal = null; render(); } else if (S.sel.partyId) cancelSeat(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'mp_mergeq') { S.mergeQ = e.target.value; const p = S.modal && prt(S.modal.id); const box = $('#mp_mres'); if (p && box) box.innerHTML = mergeResults(p); return; }
  const k = e.target.dataset.inp; if (!k) return;
  S[k] = e.target.value;
  if (k === 'q') { const pos = e.target.selectionStart; render(); const el = document.querySelector('[data-inp="q"]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(_) {} } }
});
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset.chg; if (!k) return; const d = el.dataset;
  if (k === 'role') { S.role = el.value; lsSet('seat_role', S.role); S.view = S.role === 'host' ? 'floor' : S.role === 'server' ? 'server' : 'takeout'; S.sel.partyId = null; S.modal = null; render(); return; }
  if (k === 'srvSec') { S.serverSection = el.value || null; lsSet('seat_srv_' + S.ev.id, S.serverSection); render(); return; }
  if (k === 'psel') { el.checked ? S.partySel.add(d.pid) : S.partySel.delete(d.pid); render(); return; }
  if (k === 'pf') {
    const p = prt(d.pid); if (!p) return; const f = d.f; let v = el.value;
    if (['adults','kids','takeout','gf'].includes(f)) v = int(v);
    if (f === 'party_no') { v = v === '' ? null : int(v); if (renumberConflict(p, v)) return; }
    const patch = {[f]: v}; if (f === 'status') Object.assign(patch, statusPatch(p, v));
    tx(`Edit #${p.party_no}`, () => upd('parties', p.id, patch)); render(); return;
  }
  if (k === 'roomName') { const nm = el.value.trim(); if (!nm) { render(); return; } tx('Rename room', () => upd('events', S.ev.id, {settings: {...(S.ev.settings || {}), rooms: rooms().map(r => r.id === d.rid ? {...r, name: nm} : r)}})); render(); return; }
  if (k === 'sf') { tx('Edit section', () => upd('sections', d.sid, {[d.f]: el.value.trim()})); render(); return; }
  if (k === 'tf') {
    const t = tbl(S.sel.tableId); let v = el.value; if (d.f === 'seats') v = Math.min(16, Math.max(1, int(v) || 1)); if (d.f === 'label') v = v.trim() || t.label;
    if (d.f === 'ends') v = v === '' ? null : int(v);
    if (d.f === 'room') { v = v === rooms()[0].id ? null : v; S.room = el.value; }
    tx('Edit table', () => upd('tables', t.id, {[d.f]: v})); render(); return;
  }
  if (k === 'ff') {
    let v = el.value; if (d.f === 'w' || d.f === 'h') v = Math.max(10, int(v));
    tx('Edit label', () => upd('events', S.ev.id, {fixtures: S.ev.fixtures.map(f => f.id === S.sel.fixtureId ? {...f, [d.f]: v} : f)})); render(); return;
  }
});

/* ---------------- boot ---------------- */
async function boot() {
  B = S.backend === 'local' ? Local : Remote;
  if (B === Remote) { try { Remote.init(); } catch (e) { $('#app').innerHTML = viewLogin('Could not connect to the database.'); return; } }
  S.role = lsGet('seat_role') || 'host';
  await loadEvents();
  const last = lsGet('seat_last_event');
  if (last && S.events.some(e => e.id === last)) await openEvent(last); else render();
}
function signIn(session, fallbackUser) {
  S.backend = 'remote'; lsSet('seat_backend', 'remote');
  S.user = session ? session.username : fallbackUser; S.userName = session ? (session.displayName || session.username) : fallbackUser;
  lsSet('seat_user', S.user);
}
/* Single sign-on: reuse the DELC Apps Hub session (hub_users) when it grants access to this app. */
function hubSession() {
  if (!window.DelcAuth) return null;
  try { const s = DelcAuth.getSession(); return s && DelcAuth.hasAppAccess(s, CONFIG.appKey) ? s : null; } catch (_) { return null; }
}
(async function start() {
  const params = new URLSearchParams(location.search);
  if (params.get('demo') === '1') lsSet('seat_backend', 'local');
  const backend = lsGet('seat_backend') || 'remote';
  if (backend === 'local') { S.backend = 'local'; S.user = lsGet('seat_user'); if (S.user) boot(); else render(); return; }
  let sess = hubSession();
  if (sess && DelcAuth.refreshSession) { try { await DelcAuth.refreshSession(); sess = hubSession(); } catch (_) {} }  // picks up access changes made in the Admin Portal
  if (sess && window.supabase) { signIn(sess); boot(); return; }
  S.user = null; localStorage.removeItem('seat_user');
  const s0 = window.DelcAuth && (() => { try { return DelcAuth.getSession(); } catch (_) { return null; } })();
  $('#app').innerHTML = viewLogin(s0 ? `You’re signed in to the hub as ${s0.username}, but your account doesn’t have access to delcDINING. Ask an admin to turn it on, or sign in as someone else.` : '');
})();
</script>
